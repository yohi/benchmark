[project]
name = "ollama-systemone-benchmark"
version = "0.1.0"
description = "Benchmark Ollama System One decision models for latency, accuracy, confidence, and safe offload coverage."
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "psutil>=6.0"]

[project.scripts]
systemone-bench = "systemone_bench.cli:main"
systemone-cascade = "systemone_bench.cascade:main"
systemone-policy = "systemone_bench.policy:main"
systemone-selective = "systemone_bench.selective:main"
systemone-risk-control = "systemone_bench.risk_control:main"
systemone-latency-tail = "systemone_bench.latency_tail:main"
systemone-warmup-study = "systemone_bench.warmup_study:main"
systemone-spike-analysis = "systemone_bench.spike_analysis:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/systemone_bench"]
